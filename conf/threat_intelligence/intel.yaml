feeds:
  - source_name: intelligence
    ingest_notebook: intel_enrichment
    collector:
      name: intel_staging
  - source_name: disposable-email-domains
    ingest_notebook: simple_ingest
    collector:
      name: simple_collector
      options:
        url: https://raw.githubusercontent.com/disposable-email-domains/disposable-email-domains/master/disposable_email_blocklist.conf
    context:
      type: domain
      indicator_type: disposable_email_domain
      tags:
  - source_name: freemail_disposable-email-domains
