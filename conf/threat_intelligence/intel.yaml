    collector:
      name: simple_collector
      options:
        url: https://raw.githubusercontent.com/stamparm/maltrail/master/trails/static/suspicious/ipinfo.txt
        match_pattern: r"^(?P<indicator>[a-zA-Z0-9\.\-]+)\s*.*$"
    context:
      type: domain
      indicator_type: ipinfo_domain
      tags:
