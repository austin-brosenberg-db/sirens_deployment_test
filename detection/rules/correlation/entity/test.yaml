name: 'test_rule'
summary: 'this is a test rule for <key>'
source: 'correlation_by_entity'
severity: 'low'
ruleVersion: '1'
time_window: 'eventTime >= current_timestamp - INTERVAL 90 DAYS'
event_window: 'source IN ("jamf", "zscaler", "crowdstrike")'
filter:
  - type: 'count'
    condition: 'severity = "high" AND source = "crowdstrike"'
    threshold: '>= 0'
    event_id: 'cs_high_sev'
  - type: 'count'
    condition: 'attacks[].mitre.techniqueId RLIKE "T"'
    threshold: '>= 0'
    event_id: 'mitre_attack'
  - type: 'sequence'
    events:
      - condition: 'name = "policy_using_new_script" AND summary RLIKE "The policy"'
        reset_on: 'summary RLIKE "The policy" OR name'
        event_id: 'policy_script'
      - condition: 'attacks[].mitre.techniqueId RLIKE "T"'
        event_id: 'mitre_attack'
      - condition: 'name RLIKE "script_in_use_updated"'
        event_id: 'script_in_use_updated'
    event_sequence: 'policy_script THEN WITHIN 2 HOURS mitre_attack THEN script_in_use_updated'
    event_id: 'jamf_scripts'
  - type: 'sum'
    field: 'ruleVersion'
    condition: 'source = "jamf"'
    threshold: '>= 0.0'
    event_id: 'jamf_ruleVersions_sums'
  - type: 'cardinality'
    field: 'name'
    condition: 'name RLIKE "this"'
    threshold: '>= 0'
    event_id: 'cardinality_names_like_this'
  - type: 'cardinality'
    field: 'attacks[].mitre.technique'
    condition: 'attacks[].mitre.technique RLIKE "T102"'
    threshold: '>= 0'
    event_id: 'mite_attack_T102'
compound_logic: 'cs_high_sev AND mitre_attack AND jamf_ruleVersions_sums AND cardinality_names_like_this AND mite_attack_T102'
