name: okta_impersonate_api
summary: Okta user.session.impersonation event on <oktaURL>
severity: high
source: okta
sourceDetails: <oktaURL>
alertClass: ALERT
ruleVersion: 1
eventTime: <published>
actor:
  type: USER
  domain: <oktaURL>
  id: <actor.alternateId>
  beliefCompromised: 0.1
target:
  type: USER
  domain: <oktaURL>
  id: <targetUser>
  beliefCompromised: 0.1
attacks:
- mitre:
    taxonomy: ENTERPRISE
    tactic: PRIVILEGE_ESCALATION
    techniqueId: T1548
    technique: Abuse Elevation Control Mechanism
observables:
  ipAddresses:
  - <client.ipAddress>
  domains: []
  fileHashes: []
  urls: []
context:
  Okta URL: <oktaURL>
  UserAgent: <client.userAgent.rawUserAgent>
  ipAddress: <client.ipAddress>
  who: <actor.alternateId> performed <eventType> from a suspicious IP <client.ipAddress>
filter: |-
  eventType in (
  "user.session.impersonation.initiate",
  "user.session.impersonation.grant",
  "user.session.impersonation.extend",
  "user.session.impersonation.end",
  "user.session.impersonation.revoke"
  )
test_cases:
- test_name: 'expected hit'
  expected_result: true
  expected_summary: 'Okta user.session.impersonation event on okta.example.com'
  expected_severity: high
  expected_context: 
    {
      "Okta URL": "okta.example.com",
      "UserAgent": "OktaVerify",
      "ipAddress": "1.2.3.4",
      "who": "bob@example.com performed user.session.impersonation.grant from a suspicious IP 1.2.3.4"
    }
  test_input:
    {
      "actor": {"alternateId": "bob@example.com"},
      "targetUser": "me",
      "eventType": "user.session.impersonation.grant",
      "oktaURL": "okta.example.com",
      "client": {"userAgent": {"rawUserAgent": "OktaVerify"}, "ipAddress": "1.2.3.4"},
      "published": "2022-01-01"
    }
