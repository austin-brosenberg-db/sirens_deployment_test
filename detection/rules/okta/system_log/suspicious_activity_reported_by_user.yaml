name: suspicious_activity_reported_by_user
summary: <actor.alternateId> reported suspicious activity on <oktaURL>
severity: high
source: okta
sourceDetails: <oktaURL>
alertClass: ALERT
ruleVersion: 1
eventTime: <published>
actor:
  type: UNDEFINED
  domain: <oktaURL>
  id: 
  beliefCompromised: 0.0
target:
  type: USER
  domain: <oktaURL>
  id: <actor.alternateId>
  beliefCompromised: 0.5
attacks:
- mitre:
    taxonomy: ENTERPRISE
    tactic: 
    techniqueId: 
    technique: 
    subtechniqueId: 
    subtechnique: 
