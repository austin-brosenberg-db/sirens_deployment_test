  expected_result: true
  expected_summary: 'first.last@example.com reported suspicious activity on okta.example.com'
  expected_severity: high
  expected_context: 
    {
      "Okta URL": "okta.example.com",
      "UserAgent": "OktaVerify",
      "eventType": "user.account.report_suspicious_activity_by_enduser",
      "externalSessionId": "xyz",
      "ipAddress": "1.2.3.4",
      "who": "first.last@example.com"
    }
  test_input: 
    {
        'actor': { 'alternateId': 'first.last@example.com'},
        'eventType': 'user.account.report_suspicious_activity_by_enduser',
        'oktaURL': 'okta.example.com',
        'authenticationContext': {'externalSessionId': 'xyz'},
        'debugContext': {'debugData': 'dataz'},
        'client': {
          'userAgent': {'rawUserAgent': 'OktaVerify'},
          'ipAddress': '1.2.3.4'
        },
        'published': '2022-01-01'
    }
