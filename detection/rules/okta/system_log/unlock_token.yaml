name: unlock_token
summary: Token got unlocked on <oktaURL>
severity: medium
source: okta
sourceDetails: <oktaURL>
alertClass: ALERT
ruleVersion: 1
eventTime: <published>
actor:
  type: USER
  domain: <oktaURL>
  id: <actor.alternateId>
  beliefCompromised: 0.1
target:
  type: USER
  domain: <oktaURL>
  id: <targetUser>
  beliefCompromised: 0.1
attacks:
- mitre:
    taxonomy: ENTERPRISE
    tactic: PRIVILEGE_ESCALATION
    techniqueId: T1134
    technique: Access Token Manipulation
observables:
  ipAddresses:
  - <client.ipAddress>
  domains: []
  fileHashes: []
  urls: []
context:
  Okta URL: <oktaURL>
  UserAgent: <client.userAgent.rawUserAgent>
  ipAddress: <client.ipAddress>
  who: <actor.alternateId> unlocked the locked token for <targetUser>
filter: |-
  eventType = 'user.account.unlock_token' and
  (actor.type is NULL or actor.type != 'SystemPrincipal' or actor.alternateId != 'system@okta.com')
test_cases:
- test_name: 'expected hit'
  expected_result: true
  expected_summary: 'Token got unlocked on okta.example.com'
  expected_severity: medium
  expected_context: 
    {
      "Okta URL": "okta.example.com",
      "UserAgent": "OktaVerify",
      "ipAddress": "1.2.3.4",
      "who": "bob@example.com unlocked the locked token for alice@example.com"
    }
  test_input: 
    {
      "eventType": "user.account.unlock_token",
      "actor": {"type": "User", "alternateId": "bob@example.com"},
      "oktaURL": "okta.example.com",
      "client": {"userAgent": {"rawUserAgent": "OktaVerify"}, "ipAddress": "1.2.3.4"},
      "targetUser": "alice@example.com",
      "published": "2022-01-01"
    }
