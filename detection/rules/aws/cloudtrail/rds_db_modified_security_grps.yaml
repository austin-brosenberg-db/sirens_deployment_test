name: rds_db_modified_security_grps
summary: Added security group in RDS from <userName> at <sourceIPAddress>
severity: high
source: cloudtrail
sourceDetails: 
alertClass: ALERT
ruleVersion: 1
eventTime: <timestamp>
actor:
  type: USER
  domain: userIdentity.accountId
  id: userIdentity.arn
  role: 
  beliefCompromised: 0.5
target:
  type: INFRASTRUCTURE
  domain: recipientAccountId
  id: 
  role: 
  beliefCompromised: 0.5
attacks:
- mitre:
    taxonomy: ENTERPRISE
    tactic: DEFENSE_EVASION
    techniqueId: T1562
    technique: Impair Defenses
    subtechniqueId: T1562.007
    subtechnique: Disable or Modify Cloud Firewall
observables:
  ipAddresses:
  - '[ipAddress]'
  domains: []
  fileHashes: []
  urls: []
context:
  dBInstanceIdentifier: <requestParameters.dBInstanceIdentifier>
  recipientAccountId: <recipientAccountId>
  requestorArn: <userIdentity.arn>
  securityGroups: <requestParameters.securityGroups>
filter: |-
  eventSource = 'rds.amazonaws.com'
  and eventName = 'ModifyDBInstance'
  and requestParameters.securityGroups is not NULL
test_cases:
- test_name: expected hit
  expected_result: true
  expected_summary: Added security group in RDS from Alice at 1.2.3.4
  # expected_context: {}
  test_input: 
    {
        "eventName": "ModifyDBInstance",
        "eventSource": "rds.amazonaws.com",
        "requestParameters": {"securityGroups": "_", "dBInstanceIdentifier": "test-instance"},
        "recipientAccountId": "123456789012",
        "timestamp": "2022-01-01 00:00:00",
        "userIdentity": {"arn": "arn:aws:iam::123456789012:user/Alice"},
        "sourceIPAddress": "1.2.3.4",
        "userName": "Alice"
    }
