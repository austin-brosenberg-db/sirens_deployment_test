name: apache
input_table: sirens.apache_access_combined_silver
output_table: sirens.alerts
rule_dir: access_combined
enabled: true
streamType: streaming
transformation: 
  sql: |
    SELECT * FROM {{input_table}} WHERE _event_date > CURRENT_DATE - 1
rules:
  - name: directory_traversal
    enabled: true
  - name: sqli
    enabled: true
  - name: xss
    enabled: true
  - name: exfil
    enabled: true