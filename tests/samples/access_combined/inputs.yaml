config:
  version: 1.0
  updated: 2022-06-20
  author: Derek King
  description: Process apache common log format (access_combined) logs
input:
  source: apache # [required]
  sourcetype: access_combined # [required]
  parser: apache_access_combined
  #rawPath: s3://deking-cyberops/CyberOps/dev/data_engineering/ingest_sources/apache/access_combined/ #[optional]
  rawPath: LocalPath://apache/access_combined/samples/
  #host: linux_web_1
  #host_rawPath_segment: 8
  connector:
    name: txt  # json|kafka|csv|txt [required]
  streamType: batch # batch|streaming [required]
transforms:
    bronze:
      enrichments:
        - iana
      meta:
        host_column: value
        host_regex: '^(?<host>[^ ]*)'
        timestamp_column: value
        timestamp_regex: '^(?<host>[^ ]*) [^ ]* ([^ ]*) \[(?<time>[^\]]*)\]'
        timestamp_format: "dd/MMM/yyyy:HH:mm:ss Z"
    silver:
      event_type:
       - target_table: web
         filter: _sourcetype == "access_combined"
         enrichments:
          - http_codes
         fields:
          - event_message:
              action: add
              type: literal
              value: success
          - event_message_result:
              action: add
              type: literal
              value: success
          - event_schema_version:
              action: add
              type: literal
              value: 1.0
          - event_schema_file:
              action: add
              type: literal
              value: access_log
          - event_result: 
              action: add
              type: literal
              value: success
          - _sourcetype:
              action: rename
              value: _sourcetype
          - _event_date:
              action: rename
              value: _event_date
          - _event_time:
              action: rename
              value: _event_time
          - src_hostname:
              action: alias
              value: host
          - user_name:
              action: alias
              value: user
          - http_method:
              action: alias
              value: method
          - url_path:
              action: alias
              value: path
          - http_status_code:
              action: alias
              value: code
          - http_response_body_bytes:
              action: alias
              value: size
          - http_referrer_original:
              action: alias
              value: referer
          - http_user_agent:
              action: alias
              value: agent