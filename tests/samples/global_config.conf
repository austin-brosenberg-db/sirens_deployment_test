[global]
input_config_dir = log_sources
template_dir = templates
detection_dir = detections
conf_dir = conf
hunting_notebooks_dir = notebooks/threat_hunting
response_notebooks_dir = notebooks/playbooks
threat_intel_coll_notebooks_dir = notebooks/threat_intelligence/collectors
threat_intel_ingest_notebooks_dir = notebooks/threat_intelligence/ingest
logging_level = INFO

[default]
target_database = sirens
scratch_dir = FileStore/sirens
sirens_lib = /dbfs/FileStore/tmp/databricks_sirens-0.0.1-py2.py3-none-any.whl
notebook_language = python
notebook_type = delta

[schema:risk]
risk_table = test_risk_table

[detections]
deploy_dir = deploy


########################################
# Deployment Section                   #
########################################

[deploy]
deploy_dir = deploy
groupby = source
notebook_dir = sirens_notebooks
dashboard_dir = sirens_dashboards
dbfs_upload_dir = /FileStore/sirens
sql_warehouse_id = 39adxxxxxxxxxx

[workspace:dummy_workspace]
hostname = dummy_workspace.cloud.databricks.com
cloud_service_provider = aws

[compute_attributes:aws_attributes]
instance_profile_arn = arn:aws:iam::999999999999:instance-profile/some_profile

[spark_conf_options:spark_opts_1]
sirens_wheel = latest
spark.databricks.io.cache.enabled = true
spark.databricks.io.cache.maxDiskUsage = "50g"
spark.databricks.io.cache.maxMetaDataCache = "1g"

[jobcluster:jobcluster_1]
default = true
workspace = dummy_workspace
compute_attributes = aws_attributes
spark_conf_options = spark_opts_1
min_workers = 2
max_workers = 6

[cluster:AlwaysOnCluster]
default = true
cluster_name = AlwaysOnCluster
cluster_id = 1115-999999-9999999
workspace = dummy_workspace

# Databricks Inputs
#
[input:databricks:db_audit]
enabled = false
source = databricks
sourcetype = db_audit
cluster = AlwaysOnCluster
schedule = 0 0 13 * * ?

[input:aws:cloudtrail]
enabled = true
source = aws
sourcetype = cloudtrail
jobcluster = jobcluster_1
schedule = 0 0 13 * * ?

[retention_policy]
duration = 1 years 
column = _event_date

[retention_policy:zscalerdb]
duration = 6 months 
column = _event_date

[retention_policy:zscalerdb:network]
duration = 2 weeks 
column = _event_date
