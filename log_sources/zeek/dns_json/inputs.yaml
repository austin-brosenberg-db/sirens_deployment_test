config:
  version: 1.0
  updated: 2022-10-24
  author: derek.king@databricks.com
  description: process zeek dns_log in json format
input:
  source: zeek
  sourcetype: dns_json
  parser: zeek
  rawPath: s3://deking-cyberops/CyberOps/dev/data_engineering/ingest_sources/zeek/dns_json
  host: syslog_host_1
  connector:
    name: json
    options:
  streamType: batch
transforms:
    bronze:
      meta:
        timestamp_column: ts
        timestamp_column_type: timestamp
        host: id_orig_h
    silver:
      event_type:
       - target_table: dns
         filter: _source == 'zeek' and _sourcetype == 'dns_json'
         fields:
          - _event_date:
              action: copy
          - _event_time:
              action: copy
          - event_type:
              action: add
              type: literal
              value: DNSLookup
          - event_message:
              action: add
              type: literal
              value: DNSLookup
          - event_result:
              action: add
              type: literal
              value: Success
          - event_severity:
              action: add
              type: literal
              value: Informational
          - event_schema_file:
              action: add
              type: literal
              value: dns_v1.0
          - dest:
              action: alias
              value: id_resp_h
          - dns_response_answers:
              action: alias
              value: element_at(answers, 1)
          - src:
              action: alias
              value: id_orig_h
          - src_ip_addr:
              action: alias
              value: id_orig_h
          - src_port:
              action: alias
              value: id_orig_p
          - dest_ip_addr:
              action: alias
              value: id_resp_h
          - dest_port:
              action: alias
              value: id_resp_p
          - network_protocol:
              action: alias
              value: proto
          - dns_query_type:
              action: alias
              value: qtype
          - dns_query_type_name:
              action: alias
              value: qtype_name
          - dns_query:
              action: alias
              value: query
          - dns_response_code:
              action: alias
              value: rcode
          - dns_response_name:
              action: alias
              value: rcode_name
          - uid:
              action: copy


