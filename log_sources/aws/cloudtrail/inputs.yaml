config:
  version: 1.1
  updated: 2022-10-31
  author: Derek King, Silvio Fiorito
  description: Process AWS CloudTrail Logs
input:
  source: aws
  sourcetype: cloudtrail
  parser: aws_cloudtrail
  rawPath: s3://deking-cyberops/CyberOps/dev/data_engineering/ingest_sources/aws/cloud_trail/flaws_cloudtrail_logs/
  connector:
    name: autoloader
    options:
      cloudFiles.format: json
      cloudFiles.schemaEvolutionMode: rescue
      cloudFiles.inferColumnTypes: true
      cloudFiles.schemaLocation: dbfs:/FileStore/sirens_dev/schemas/aws_cloud_trail # not needed for DLT
      cloudFiles.schemaHints: 'Records.element.requestParameters map<string, string>,Records.element.responseElements map<string, string>,Records.element.resources array<map<string, string>>,Records.element.serviceEventDetails map<string, string>,Records.element.additionalEventData map<string, string>,Records.element.userIdentity.sessionContext.webIdFederationData struct<federatedProvider:string, attributes:map<string,string>>'
  streamType: streaming
transforms:
    bronze:
      meta:
        timestamp_column: record.eventTime
        timestamp_regex: 
        timestamp_format: "yyyy-MM-dd'T'HH:mm:ss'Z'"
    silver:
      event_type:
        - target_table: authentication
          framework: ocsf
          name: console_logins
          filter: eventName == "ConsoleLogin" or "additionalEventData.MFAUsed" == "Yes"
          fields:
           - _event_date:
               action: copy
           - _event_time:
               action: copy
           - _sourcetype:
               action: copy
           - _source:
               action: copy
           - dvc_hostname:
               action: copy
           - class_uid: 
               action: add
               type: literal
               value: 3002
           - class_name:
               action: add
               type: literal
               value: Authentication
           - category_name:
               action: add
               type: literal
               value: Identity & Access Management Category
           - cloud:
               action: add
               type: struct
           - cloud.provider:
               action: add
               type: literal
               value: AWS
           - cloud.region:
               action: alias
               value: awsRegion
           - severity_id:
               action: add
               type: literal
               value: 1
           - severity:
               action: add
               type: literal
               value: Informational
           - activity_id:
               action: add
               type: expression
               value: case when eventName == "ConsoleLogin" then 1 when eventName == "ExternalIdPDirectoryLogin" then 1 when eventName like '%AssumeRole%' then 1 else 99 end 
           - activity_name:
               action: add
               type: expression
               value: case when eventName == "ConsoleLogin" then "Logon" when eventName == "ExternalIdPDirectoryLogin" then "Logon" when eventName like '%AssumeRole%' then "Logon" else "Other" end
           - actor:
                action: add
                type: struct
           - actor.user:
                action: add
                type: struct
           - actor.user.account:
                action: add
                type: struct
           - actor.user.account.uid:
                action: alias
                value: userIdentity.accountId
           - actor.user.credential_uid:
                action: alias
                value: userIdentity.accessKeyId
           - actor.user.name:
                action: add
                type: expression
                value: coalesce(userIdentity.sessionContext.sessionIssuer.userName, 'null')
           - actor.user.type:
                action: alias
                value: userIdentity.type
           - actor.user.uid:
                action: alias
                value: userIdentity.arn
           - actor.user.uid_alt:
                action: alias
                value: userIdentity.principalId
           - actor.session:
                action: add
                type: struct
           - actor.session.created_time:
                action: add
                type: expression
                value: unix_timestamp(userIdentity.sessionContext.attributes.creationDate)
        #    - actor.session.created_time_dt:
        #         action: alias
        #         value: userIdentity.sessionContext.attributes.creationDate
           - actor.session.issuer:
                action: alias
                value: userIdentity.sessionContext.sessionIssuer.arn
           - actor.invoked_by:
                action: alias
                value: userIdentity.invokedBy
        #    - actor.idp:
        #         action: add
        #         type: struct
        #identity provider is nowhere in the silver schema - commenting out for now
        #    - actor.idp.name:
        #         action: add
        #         type: expression
        #         value: coalesce(userIdentity.identityProvider, userIdentity.sessionContext.webIdFederationData.federatedProvider)   
           - api:
                action: add
                type: struct
           - api.request:
                action: add
                type: struct
           - api.request.uid:
                action: add
                type: expression
                value: coalesce(requestID, "")
           - api.service:
                action: add
                type: struct
           - api.service.name:
                action: alias
                value: eventSource
           - api.version:
                action: alias
                value: apiVersion
           - api.operation:
                action: alias
                value: eventName
           - api.response:
                action: add
                type: struct
           - api.response.error:
                action: alias
                value: errorCode
           - api.response.message:
                action: alias
                value: errorMessage
           - api.request.data:
                action: alias
                value: requestParameters
           - api.response.data:
                action: alias
                value: responseElements
           - http_request:
                action: add
                type: struct
           - http_request.user_agent:
                action: alias
                value: userAgent
           - is_mfa:
                action: add
                type: expression
                value: case when additionalEventData.MFAUsed == 'No' then 0 when additionalEventData.MFAUsed == 'Yes' then 1 end
           - metadata:
                action: add
                type: struct
           - metadata.log_provider:
               action: add
               type: literal
               value: CloudTrail
           - metadata.event_code:
               action: alias
               value: eventType
           - metadata.product:
                action: add
                type: struct
           - metadata.product.version:
               action: alias
               value: eventVersion
           - metadata.product.feature:
                action: add
                type: struct
           - metadata.product.feature.name:
                action: add
                type: literal
                value: Management, Data, and Insights
           - metadata.uid:
               action: alias
               value: eventID
           - metadata.product.name:
               action: add
               type: literal
               value: CloudTrail
           - metadata.product.vendor_name:
               action: add
               type: literal
               value: AWS
           - metadata.version:
               action: add
               type: literal
               value: 1.1.0
           - metadata.profiles:
               action: add
               type: literal
               value: ["cloud", "datetime"]
           - session:
                action: add
                type: struct 
           - session.expiration_time:
                action: add
                type: expression
                value: coalesce(to_unix_timestamp(ar_resp_credentials.expiration, "yyyy-MM-dd'T'HH:mm:ss'Z'") * 1000, "null")
           - src_endpoint:
                action: add
                type: struct
           - src_endpoint.ip:
                action: add
                type: expression
                value: case when sourceIPAddress rlike '^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}$' then sourceIPAddress else NULL end
           - src_endpoint.domain:
                action: add
                type: expression
                value: case when sourceIPAddress not rlike '^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}$' then sourceIPAddress else NULL end
           - status_id:
                action: add
                type: expression
                value: case when responseElements.ConsoleLogin == 'Unknown' then 0 when responseElements.ConsoleLogin == 'Success' then 1 when responseElements.ConsoleLogin == 'Failure' then 2 when responseElements.ConsoleLogin == 'Other' then 99 end          
           - status:
               action: alias
               value: responseElements.ConsoleLogin    
           - time:
                action: add
                type: expression
                value: unix_timestamp(eventTime) * 1000
           - event_dt:
               action: alias
               value: eventTime       
           - user:
                action: add
                type: struct 
           - user.uid:
                action: add
                type: expression
                value: coalesce(requestParameters.roleArn, userIdentity.arn)
           - user.name:
                action: add
                type: expression
                value: case when requestParameters['roleSessionName'] is not NULL then requestParameters else NULL end
           - user.uid_alt:
                action: alias
                value: userIdentity.principalId
        - target_table: authentication
          framework: cim
          name: console_logins
          filter: eventName == "ConsoleLogin" or "additionalEventData.MFAUsed" == "Yes"
          fields:
           - _event_date:
               action: copy
           - _event_time:
               action: copy
           - _sourcetype:
               action: copy
           - _source:
               action: copy
           - dvc_hostname:
               action: copy
           - dvc: 
               action: alias
               value: dvc_hostname
           - event_type:
               action: add
               type: literal
               value: Logon
           - event_sub_type:
               action: alias
               value: eventName
           - event_message:
               action: add
               type: expression
               value: coalesce(errorCode,'success')
           - event_result:
               action: add
               type: expression
               value: case when isnotnull(responseElements.ConsoleLogin) then lower(responseElements.ConsoleLogin) when (isnull(responseElements.ConsoleLogin) and isnotnull(credentials.sessionToken)) then lower(credentials.sessionToken) end
           - event_schema_file:
               action: add
               type: literal
               value: authentication
           - event_severity:
               action: add
               type: literal
               value: Informational
           - http_user_agent:
               action: alias
               value: userAgent
           - logon_target:
               action: alias
               value: eventSource
           - src:
               action: alias
               value: sourceIPAddress
           - src_ip_addr:
               action: alias
               value: sourceIPAddress
           - dst:
               action: alias
               value: eventSource
           - target_app_name:
               action: alias
               value: eventSource
           - target_url:
               action: alias
               value: additionalEventData.LoginTo
           - target_hostname:
               action: alias
               value: eventSource
           - target_domain:
               action: alias
               value: awsRegion
           - event_vendor:
               action: add
               type: literal
               value: aws
           - event_product:
               action: alias
               value: eventSource
           - target_user_id:
               action: alias
               value: accountId
           - target_user_name:
               action: add
               type: expression
               value: coalesce(userName, userIdentity.userName,  substring_index(userIdentity.arn, ':', -1))
           - target_user_type:
               action: add
               type: literal
               value: AWSId
           - user:
               action: alias
               value: target_user_name
        - target_table: file
          framework: cim
          name: s3_access
          filter: eventSource == "s3.amazonaws.com"
          fields:
           - _event_date:
               action: copy
           - _event_time:
               action: copy
           - _sourcetype:
               action: copy
           - _source:
               action: copy
           - dvc_hostname:
               action: copy
           - dvc: 
               action: alias
               value: dvc_hostname
           - event_type:
               action: add
               type: expression
               value: case when eventName like 'Get%' then 'FileAccessed' when eventName = 'PutObject' then 'FileCreated' when eventName like 'Put%' then 'FileModified' when eventName = 'DeleteObject' then 'FileDeleted' when eventName like 'DeleteObject%' then 'FileModified' end
           - event_sub_type:
               action: alias
               value: eventName
           - event_message:
               action: add
               type: expression
               value: coalesce(errorCode,'success')
           - event_result:
               action: add
               type: expression
               value: coalesce(errorCode,'success')
           - event_schema_file:
               action: add
               type: literal
               value: FileEvent
           - event_severity:
               action: add
               type: literal
               value: Informational
           - http_user_agent:
               action: alias
               value: userAgent
           - logon_target:
               action: alias
               value: eventSource
           - src:
               action: alias
               value: sourceIPAddress
           - src_ip_addr:
               action: alias
               value: sourceIPAddress
           - dst:
               action: add 
               type: expression
               value: coalesce(requestParameters.bucket, requestParameters.bucketName)
           - target_app_name:
               action: alias
               value: eventSource
           - target_url:
               action: add
               type: expression
               value: concat('s3://', coalesce(requestParameters.bucket, requestParameters.bucketName), coalesce(requestParameters.key, ''))
           - target_hostname:
               action: alias
               value: eventSource
           - target_domain:
               action: alias
               value: awsRegion
           - event_vendor:
               action: add
               type: literal
               value: aws
           - event_product:
               action: alias
               value: eventSource
           - target_user_id:
               action: alias
               value: recipientAccountId
           - target_user_name:
               action: add
               type: expression
               value: coalesce(userIdentity.userName,  substring_index(userIdentity.arn, ':', -1))
           - target_user_type:
               action: add
               type: literal
               value: AWSId
           - user:
               action: alias
               value: target_user_name
