test_cases:
  - name: vmware_esxi
    connector: txt
    sample: vmware_esxi_sample.txt
    transforms:
      bronze:
        expected_columns: _event_date, _event_time, _ingest_time, _source, _source_file, _sourcetype, dvc_hostname, value
        expected_values:
          - _source: 'vmware'
          - _sourcetype: 'esxi'
      silver:
        expected_columns: _event_date, _event_time, _ingest_time, _source, _source_file, _sourcetype, dvc_hostname, priority_value, message_text, process_id
        expected_values:
          - priority_value: 14
          - process_id: '567890'
