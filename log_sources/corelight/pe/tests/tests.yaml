        expected_columns: _event_date, _event_time, _ingest_time, _source, _source_file, _sourcetype,dvc_hostname, uses_seh, _write_ts, ts, uses_aslr, os, has_cert_table, has_import_table,section_names, _path, is_exe, compile_ts, id, machine, has_debug_data, uses_dep,uses_dep, is_64bit, subsystem, uses_code_integrity, _system_name, has_export_table
