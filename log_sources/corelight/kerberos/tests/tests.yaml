      silver:
        expected_columns: _event_date, _event_time, _ingest_time, _source, _source_file, _sourcetype,dvc_hostname, forwardable, till, success, id.resp_h, _write_ts, id.orig_h, ts, request_type,id.orig_p, service, _path, renewable, cipher, client, id.resp_p, uid, _system_name
