config:
  version: 1.0
  updated: 2022-09-07
  author: Derek King
  description: Microsoft Sysmon Inputs
input:
  source: microsoft
  sourcetype: sysmon
  parser: microsoft_sysmon_beats_kafka
  rawSchemaFile: schema.json
  connector:
    name: kafka    # <txt|csv|json|kafka|autoloader|parquet>
    options:
      kafka.bootstrap.servers: 10.0.194.186:9094
      startingOffsets: latest
      subscribe: winlogbeat
      failOnDataLoss: false
  streamType: streaming
transforms:
  bronze:
    meta:
      timestamp_column: "timestamp"
      timestamp_format: "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'" # 2022-04-26T04:02:53.687+0000
      host_column: name
  silver:
    event_type:
      - target_table: process
        filter: winlog_event_id == '1' OR winlog_event_id == '5' OR winlog_event_id == '18'
        fields:
        - _sourcetype:
            action: copy
        - _event_time:
            action: copy
        - _event_date:
            action: copy
        - event_type:
            action: add
            type: expression
            value: case when (winlog_event_id == "1") then "Process Created" when (winlog_event_id == "5") then "Process Terminated" when (winlog_event_id == "18") then "Process Terminated" else "unknown" end
        - event_schema_version:
            action: add
            type: literal
            value: "1.0"
        - event_schema_file:
            action: add
            type: literal
            value: winlogbeat-sysmon
        - event_message:
            action: add
            type: literal
            value: New Process Created
        - event_result:
            action: add
            type: literal
            value: success
        - event_id:
            action: alias
            value: winlog_event_id
        - event_category_type:
            action: alias
            value: winlog_task
        - event_severity:
            action: add
            type: expression
            value: case when log_level == "information" then "Informational" else "unknown" end
        - event_original_severity:
            action: alias
            value: log_level
        - event_status:
            action: alias
            value: event_action
        - process_command_line:
            action: alias
            value: winlog_event_data_CommandLine
        - file_company:
            action: alias
            value: winlog_event_data_Company
        - process_file_directory:
            action: alias
            value: winlog_event_data_CurrentDirectory
        - file_description:
            action: alias
            value: winlog_event_data_Description
        - process_file_path:
            action: alias
            value: winlog_event_data_Image
        - process_integrity_level:
            action: alias
            value: winlog_event_data_IntegrityLevel
        - user_logon_guid:
            action: alias
            value: winlog_event_data_LogonGuid
        - file_name_original:
            action: alias
            value: winlog_event_data_OriginalFileName
        - process_parent_command_line:
            action: alias
            value: winlog_event_data_ParentCommandLine
        - process_parent_file_path:
            action: alias
            value: winlog_event_data_ParentImage
        - process_parent_guid:
            action: alias
            value: winlog_event_data_ParentProcessGuid
        - process_parent_id:
            action: alias
            value: winlog_event_data_ParentProcessId
        - acting_user_name:
            action: alias
            value: winlog_event_data_ParentUser
        - process_id:
            action: alias
            value: winlog_event_data_ProcessID
        - process_name:
            action: alias
            value: winlog_event_data_ProcessName
        - file_product:
            action: alias
            value: winlog_event_data_Product
        - user_session_id:
            action: alias
            value: winlog_event_data_TerminalSessionId
        - user_name:
            action: alias
            value: winlog_event_data_User
        - file_version:
            action: alias
            value: winlog_event_data_FileVersion
        - process_guid:
            action: alias
            value: winlog_event_data_ProcessGuid
        - file_hashes:
            action: alias
            value: winlog_event_data_Hashes
      - target_table: registry
        filter: winlog_event_id == '12' OR winlog_event_id == '13' OR winlog_event_id == '14'
        fields:
        - _sourcetype:
            action: copy
        - _event_time:
            action: copy
        - _event_date:
            action: copy
        - event_schema_version:
            action: add
            type: literal
            value: "1.0"
        - event_schema_file:
            action: add
            type: literal
            value: winlogbeat-sysmon
        - event_id:
            action: alias
            value: winlog_event_id
        - event_category_type:
            action: alias
            value: winlog_task
        - event_severity:
            action: add
            type: expression
            value: case when log_level == "information" then "Informational" else "unknown" end
        - event_original_severity:
            action: alias
            value: log_level
        - event_result:
            action: add
            type: literal
            value: success
        - event_message:
            action: add
            type: expression
            value: case when winlog_event_data_EventType == "CreateKey" then "Registry Key Created" when winlog_event_data_EventType == "SetValue" then "Registry Key Changed" when winlog_event_data_EventType == "DeleteKey" then "Registry Key Deleted" when winlog_event_data_EventType == "DeleteValue" then "Registry Value Deleted" end   
        - event_status:
            action: alias
            value: event_action
        - event_type:
            action: alias
            value: winlog_event_data_EventType
        - process_guid:
            action: alias
            value: winlog_event_data_ProcessGuid
        - process_id:
            action: alias
            value: winlog_event_data_ProcessID
        - process_file_path:
            action: alias
            value: winlog_event_data_Image
        - registry_path:
            action: alias
            value: winlog_event_data_TargetObject
        - registry_value:
            action: alias
            value: winlog_event_data_Details
      - target_table: service
        filter: winlog_event_id == '4'
        fields:
        - _sourcetype:
            action: copy
        - _event_time:
            action: copy
        - _event_date:
            action: copy
        - event_schema_version:
            action: add
            type: literal
            value: "1.0"
        - event_schema_file:
            action: add
            type: literal
            value: winlogbeat-sysmon
        - event_id:
            action: alias
            value: winlog_event_id
        - event_category_type:
            action: alias
            value: winlog_task
        - event_severity:
            action: add
            type: expression
            value: case when log_level == "information" then "Informational" else "unknown" end
        - event_original_severity:
            action: alias
            value: log_level
        - event_result:
            action: add
            type: literal
            value: success
        - event_message:
            action: add
            type: literal
            value: Service State Changed
        - event_status:
            action: alias
            value: event_action
        - event_type:
            action: alias
            value: winlog_event_data_EventType
        - service_state:
            action: alias
            value: winlog_event_data_State
        - file_version:
            action: alias
            value: winlog_event_data_Version
        - process_pid:
            action: alias
            value: winlog_process_pid
      - target_table: file
        filter: winlog_event_id == '11' OR winlog_event_id == "23"
        fields:
        - _sourcetype:
            action: copy
        - _event_time:
            action: copy
        - _event_date:
            action: copy
        - event_schema_version:
            action: add
            type: literal
            value: "1.0"
        - event_schema_file:
            action: add
            type: literal
            value: winlogbeat-sysmon
        - event_id:
            action: alias
            value: winlog_event_id
        - event_category_type:
            action: alias
            value: winlog_task
        - event_severity:
            action: add
            type: expression
            value: case when log_level == "information" then "Informational" else "unknown" end
        - event_original_severity:
            action: alias
            value: log_level
        - event_result:
            action: add
            type: literal
            value: success
        - event_message:
            action: add
            type: literal
            value: File Created
        - event_status:
            action: alias
            value: event_action
        - event_type:
            action: alias
            value: winlog_event_data_EventType
        - process_guid:
            action: alias
            value: winlog_event_data_ProcessGuid
        - process_id:
            action: alias
            value: winlog_event_data_ProcessID
        - process_file_path:
            action: alias
            value: winlog_event_data_Image
        - file_name:
            action: alias
            value: winlog_event_data_TargetFilename
        - file_creation_time:
            action: alias
            value: winlog_event_data_CreationUtcTime
        - user_name:
            action: alias
            value: winlog_event_data_User
        - file_hashes:
            action: alias
            value: winlog_event_data_Hashes
      - target_table: network
        filter: winlog_event_id == '3'
        fields:
        - _sourcetype:
            action: copy
        - _event_time:
            action: copy
        - _event_date:
            action: copy
        - event_schema_version:
            action: add
            type: literal
            value: "1.0"
        - event_schema_file:
            action: add
            type: literal
            value: winlogbeat-sysmon
        - event_id:
            action: alias
            value: winlog_event_id
        - event_category_type:
            action: alias
            value: winlog_task
        - event_severity:
            action: add
            type: expression
            value: case when log_level == "information" then "Informational" else "unknown" end
        - event_original_severity:
            action: alias
            value: log_level
        - event_result:
            action: add
            type: literal
            value: success
        - event_message:
            action: add
            type: literal
            value: Network Connection
        - event_type:
            action: add
            type: literal
            value: Network Connection
        - event_status:
            action: alias
            value: event_action
        - process_guid:
            action: alias
            value: winlog_event_data_ProcessGuid
        - process_id:
            action: alias
            value: winlog_event_data_ProcessID
        - process_file_path:
            action: alias
            value: winlog_event_data_Image
        - user_name:
            action: alias
            value: winlog_event_data_User
        - network_direction:
            action: add
            type: expression
            value: case when winlog_event_data_Initiated == "true" then "Outbound" when winlog_event_data_Initiated == "false" then "Inbound" end
        - network_protocol:
            action: alias
            value: winlog_event_data_Protocol
        - network_initiated:
            action: alias
            value: winlog_event_data_Initiated
        - src_ip_is_ipv6:
            action: alias
            value: winlog_event_data_SourceIsIpv6
        - src_ip_addr:
            action: alias
            value: winlog_event_data_SourceIp
        - src_dvc_hostname:
            action: alias
            value: winlog_event_data_SourceHostname
        - src_port_number:
            action: alias
            value: winlog_event_data_SourcePort
        - dst_ip_is_ipv6:
            action: alias
            value: winlog_event_data_DestinationIsIpv6
        - dst_ip_addr:
            action: alias
            value: winlog_event_data_DestinationIp
        - dst_dvc_hostname:
            action: alias
            value: winlog_event_data_DestinationHostname
        - dst_port_number:
            action: alias
            value: winlog_event_data_DestinationPort
        - dst_port_name:
            action: alias
            value: winlog_event_data_DestinationPortName
        - dvc_action:
            action: add
            type: literal
            value: allow
        - src:
            action: alias
            value: winlog_event_data_SourceIp
        - dst:
            action: alias
            value: winlog_event_data_DestinationIp
      - target_table: dns
        filter: winlog_event_id == '22'
        fields:
        - _sourcetype:
            action: copy
        - _event_time:
            action: copy
        - _event_date:
            action: copy
        - event_schema_version:
            action: add
            type: literal
            value: "1.0"
        - event_schema_file:
            action: add
            type: literal
            value: winlogbeat-sysmon
        - event_id:
            action: alias
            value: winlog_event_id
        - event_category_type:
            action: alias
            value: winlog_task
        - event_severity:
            action: add
            type: expression
            value: case when log_level == "information" then "Informational" else "unknown" end
        - event_original_severity:
            action: alias
            value: log_level
        - event_result:
            action: add
            type: literal
            value: success
        - event_message:
            action: add
            type: literal
            value: DNS Query
        - event_status:
            action: alias
            value: event_action
        - event_type:
            action: alias
            value: winlog_event_data_EventType
        - process_guid:
            action: alias
            value: winlog_event_data_ProcessGuid
        - process_id:
            action: alias
            value: winlog_event_data_ProcessID
        - dst_host_name:
            action: alias
            value: winlog_event_data_QueryName
        - dns_response_code:
            action: alias
            value: winlog_event_data_QueryStatus
        - dns_response_name:
            action: alias
            value: winlog_event_data_QueryResults
        - process_file_path:
            action: alias
            value: winlog_event_data_Image
      - target_table: wmi
        filter: winlog_event_id == '19' OR winlog_event_id == '20' OR winlog_event_id == '21'
        fields:
        - _sourcetype:
            action: copy
        - _event_time:
            action: copy
        - _event_date:
            action: copy
        - event_schema_version:
            action: add
            type: literal
            value: "1.0"
        - event_schema_file:
            action: add
            type: literal
            value: winlogbeat-sysmon
        - event_id:
            action: alias
            value: winlog_event_id
        - event_category_type:
            action: alias
            value: winlog_task
        - event_severity:
            action: add
            type: expression
            value: case when log_level == "information" then "Informational" else "unknown" end
        - event_original_severity:
            action: alias
            value: log_level
        - event_result:
            action: add
            type: literal
            value: success
        - event_message:
            action: add
            type: literal
            value: dns
        - event_type:
            action: alias
            value: winlog_event_data_EventType
        - event_status:
            action: alias
            value: event_action
        - user_name:
            action: alias
            value: winlog_event_data_User
        - wmi_query:
            action: alias
            value: winlog_event_data_QueryName
